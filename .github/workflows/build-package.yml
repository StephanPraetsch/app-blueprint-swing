name: Build and Package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_type: deb
            artifact_name: linux-deb
            artifact_glob: dist/*.deb
          - os: macos-latest
            package_type: dmg
            artifact_name: macos-dmg
            artifact_glob: dist/*.dmg
          - os: windows-latest
            package_type: exe
            artifact_name: windows-exe
            artifact_glob: dist/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Linux packaging dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Install WiX Toolset
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install wixtoolset --yes

      - name: Build fat jar
        run: mvn -B -DskipTests package

      - name: Determine project version
        shell: bash
        run: |
          project_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
          package_version="${project_version%-SNAPSHOT}"
          echo "PROJECT_VERSION=$project_version" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Create native installer with jpackage
        shell: bash
        run: |
          mkdir -p build/jpackage/input
          cp "target/app-blueprint-swing-${PROJECT_VERSION}-all.jar" build/jpackage/input/app-blueprint-swing.jar

          jpackage \
            --name AppBlueprintSwing \
            --app-version "$PACKAGE_VERSION" \
            --input build/jpackage/input \
            --main-jar app-blueprint-swing.jar \
            --main-class com.stephan.appblueprintswing.AppBlueprintSwingApplication \
            --dest dist \
            --type "${{ matrix.package_type }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true

